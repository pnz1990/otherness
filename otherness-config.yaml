# otherness-config.yaml
# otherness running on itself.

project:
  name: otherness
  repo: pnz1990/otherness
  report_issue: 2
  board_url: ""
  pr_label: "otherness"
  # job_family: SDE  # SDE (default, backend/general) | FEE (frontend/UI) | SysDE (platform/infra)
  # otherness itself is markdown — no UI, no infrastructure. SDE default is correct; field omitted.

maqa:
  mode: standalone
  agents_path: ~/.otherness/agents
  status_update_cycles: 5
  product_validation_cycles: 3
  autonomous_mode: true    # operator has authorized agent to act on their behalf
  session_item_limit: 10   # max items to complete per session before SM/PM gate fires
  # Security: M2 (docs/design/27-security-model.md §Mitigations)
  # Pins the otherness git clone to a specific commit SHA so that a compromised
  # pnz1990/otherness repo cannot push malicious agent instructions via `git pull`.
  # The SELF-UPDATE block in standalone.md does `git checkout $agent_version` when set.
  # Update this value after reviewing changelog at: https://github.com/pnz1990/otherness/commits
  agent_version: 992aad0828e26c5eda8156879d1b0c47e14fc3c6  # main HEAD at 2026-04-20

ci:
  provider: github-actions
  github_actions:
    workflow: ci.yml
  wait_timeout_seconds: 600
  block_on_red: true

github_projects:
  project_id: ""
  project_number: ""
  linked_repo: pnz1990/otherness
  status_field_id: ""
  todo_option_id: ""
  in_progress_option_id: ""
  in_review_option_id: ""
  done_option_id: ""
  blocked_option_id: ""
  team_field_id: ""
  team_standalone_option_id: ""
  priority_field_id: ""
  priority_critical_option_id: ""
  priority_high_option_id: ""
  priority_medium_option_id: ""
  priority_low_option_id: ""
  size_field_id: ""
  size_xs_option_id: ""
  size_s_option_id: ""
  size_m_option_id: ""
  size_l_option_id: ""
  size_xl_option_id: ""
  start_date_field_id: ""
  target_date_field_id: ""

monitor:
  projects:
    - pnz1990/kardinal-promoter
    - pnz1990/kro-ui
    - pnz1990/otherness
  stale_hours: 24
  idle_hours: 4

# ── Scheduled execution ──────────────────────────────────────────────────────
# Enables the loop to run automatically via GitHub Actions without human action.
# Set up: add ANTHROPIC_API_KEY (or your provider key) to GitHub repo secrets.
# See .github/workflows/otherness-scheduled.yml and docs/design/19-scheduled-execution.md
schedule:
  cron: "0 * * * *"         # HOURLY — locked. Do not change to */6 or slower.
  model: "amazon-bedrock/global.anthropic.claude-sonnet-4-6"
  api_key_secret: "ANTHROPIC_API_KEY"   # GitHub Actions secret name containing the API key
  vibe_vision_step: true                # Step A: autonomous vision scan before each run

# ── Continuous code hygiene ────────────────────────────────────────────────────
hygiene:
  enabled: true
  max_issues_per_scan: 3
  cycle_interval: 3

# ── Simulation calibration ─────────────────────────────────────────────────────
# Controls how often SM §4e re-calibrates simulation parameters against real batch
# history and writes .otherness/sim-prediction.json to the _state branch.
# See docs/design/23-simulation-as-anchor.md for the full design.
simulation:
  calibration_cycles: 5             # re-calibrate every N SM cycles (default: 5)

# ── Anchor framework ──────────────────────────────────────────────────────────
# Optional: configure when this project has an anchor workflow (automated quality signal).
# An anchor is a CI workflow that runs on a schedule and posts a score to a GitHub issue.
# otherness SM §4g-anchor reads the score to detect feature→anchor coverage gaps.
#
# See docs/design/24-project-anchor-framework.md for the full design.
#
# Note: otherness itself does not have a PDCA/anchor workflow — workflow is empty.
# Managed projects (kardinal-promoter, kro-ui) configure their own anchor: sections.
anchor:
  workflow: ""                                         # no anchor workflow on the otherness repo
  score_pattern: "PASS=([0-9]+) FAIL=([0-9]+)"        # regex to extract pass/fail from issue comment
  coverage_target: 80                                  # minimum % of features with anchor coverage
  stagnation_sessions: 3                               # sessions without growth before COORD prioritizes
