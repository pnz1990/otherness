# otherness-config.yaml — copy this to your project root and edit.
# This is the only file otherness needs from your project.

# ── Project identity ──────────────────────────────────────────────────────────
project:
  name: my-project                    # human-readable name
  repo: owner/repo                    # GitHub owner/repo
  report_issue: 1                     # issue number for agent reports
  board_url: ""                       # https://github.com/users/<owner>/projects/<N>
  pr_label: ""                        # label applied to all feature PRs (e.g. "myproject")

  # The engineering domain of this project. Controls which role identity the ENG
  # and QA agents adopt when implementing and reviewing code.
  #
  #   SDE     — backend service, API, CLI tool, library, data pipeline (default)
  #   FEE     — web app, mobile app, browser extension, any user-facing UI
  #   SysDE   — infrastructure-as-code, deployment pipelines, platform tooling,
  #             monitoring systems, developer tooling
  #
  # See ~/.otherness/agents/skills/role-based-agent-identity.md §Layer 2
  # for the full role definition applied to each value.
  job_family: SDE

# ── Execution mode ────────────────────────────────────────────────────────────
maqa:
  mode: standalone                    # standalone | bounded-standalone
  agents_path: ~/.otherness/agents    # path to agent instruction files

  # How often the unbounded standalone posts an executive status update to the
  # GitHub Projects board. Set in cycles (1 cycle = 1 item worked on). 0 = off.
  status_update_cycles: 5

  # How often the PM phase runs the actual product against user journeys.
  # Opens bug/doc issues for failures. Set in cycles. 0 = off.
  product_validation_cycles: 3

  # Autonomous mode — agent acts on the operator's behalf for CRITICAL changes.
  # When true: CRITICAL tier PRs are self-reviewed with logged reasoning and
  # merged autonomously if all safety checks pass. [NEEDS HUMAN] issues are
  # resolved by the agent directly. The loop never blocks waiting for human input.
  #
  # When false: CRITICAL tier PRs (changes to agents/standalone.md in the
  # *otherness repo itself*) require a human to review and merge them. For projects
  # other than the otherness repo, there are no CRITICAL tier files — leave this
  # true unless you are running otherness on the otherness source repo.
  #
  # Set to false only if: you are running otherness on the pnz1990/otherness repo
  # AND you want to personally review every change to the agent loop before it
  # deploys globally to all otherness users.
  autonomous_mode: true

  # Max items to complete per session before SM/PM gate fires.
  # Higher = more throughput per session. Lower = more frequent triage and metrics.
  # With multi-item sessions (docs/design/21-session-throughput.md), a session running
  # for 30–60 min can ship 3–10 items. Default: 10.
  session_item_limit: 10

  # Version pinning — pin to a specific otherness release tag or commit SHA.
  # Security (M2, docs/design/27-security-model.md): setting this value prevents
  # a compromised pnz1990/otherness repo from pushing malicious agent instructions
  # via `git pull` on the next scheduled run. The SELF-UPDATE block does
  # `git checkout $agent_version` when set, freezing agent behavior at a known state.
  # When empty: agent pulls latest main (convenient but less secure).
  # Recommended: always set this for projects with scheduled autonomous runs.
  agent_version: ""     # e.g. "v0.2.0" — leave empty for latest main (insecure)

  # Auto-upgrade policy — controls which newer releases are adopted automatically
  # at workflow Step 3, before the agent starts (same session gets the upgrade).
  #   "0.2.x"  → auto-upgrade to any newer 0.2.* patch release
  #   "0.x.x"  → auto-upgrade to any newer 0.*.* minor or patch release
  #   ""        → no auto-upgrade (fully pinned; update agent_version manually)
  # Major version boundary (0.x → 1.0) is NEVER crossed automatically.
  # Design ref: docs/design/03-versioned-release.md
  upgrade_policy: "0.x.x"  # recommended default: track all 0.* releases

  # D4 zone enforcement — enforces declarative design-driven development.
  # When true: guard.sh is called before file writes; guard-ci.sh runs in CI;
  # feat/* branches cannot create new docs/aide/ or docs/design/ files;
  # vision/* branches cannot modify code files.
  # Disable only if your project does not use the D4 hierarchy (legacy projects).
  d4_enforcement: true

  # Multi-session spatial coordination: maps area labels to file path prefixes.
  # Parallel sessions skip items whose area overlaps with an active claim's file_spaces.
  # Uncomment and customize for your project's directory structure.
  # area_file_spaces:
  #   area/ui: ["src/components/", "src/styles/", "src/hooks/"]
  #   area/controller: ["internal/", "pkg/", "api/"]
  #   area/cli: ["cmd/", "internal/cli/"]
  #   area/docs: ["docs/", "README.md"]
  #   area/release: [".github/workflows/", "Makefile"]
  #   area/graph: ["internal/graph/", "scripts/"]
  #   area/agent-loop: ["agents/", "scripts/"]

# ── CI gate ───────────────────────────────────────────────────────────────────
ci:
  provider: github-actions            # github-actions | circleci | gitlab | bitbucket

  github_actions:
    workflow: ci.yml

  circleci:
    org_slug: ""
    project_slug: ""

  gitlab:
    base_url: https://gitlab.com
    project_id: ""

  bitbucket:
    workspace: ""
    repo_slug: ""

  wait_timeout_seconds: 1200          # how long to poll CI before giving up
  block_on_red: true                  # block merge if CI is red

# ── GitHub Projects board ─────────────────────────────────────────────────────
# Leave project_id blank to disable board sync entirely.
github_projects:
  project_id: ""                      # PVT_kwHO... from GraphQL
  project_number: ""                  # numeric project number
  linked_repo: owner/repo             # same as project.repo

  # Status column field + options — run /otherness.setup to auto-populate via GitHub GraphQL
  status_field_id: ""
  todo_option_id: ""
  in_progress_option_id: ""
  in_review_option_id: ""
  done_option_id: ""
  blocked_option_id: ""

  # Team field
  team_field_id: ""
  team_engineer1_option_id: ""
  team_engineer2_option_id: ""
  team_engineer3_option_id: ""
  team_standalone_option_id: ""

  # Priority field
  priority_field_id: ""
  priority_critical_option_id: ""
  priority_high_option_id: ""
  priority_medium_option_id: ""
  priority_low_option_id: ""

  # Size field
  size_field_id: ""
  size_xs_option_id: ""
  size_s_option_id: ""
  size_m_option_id: ""
  size_l_option_id: ""
  size_xl_option_id: ""

  # Date fields
  start_date_field_id: ""
  target_date_field_id: ""

# ── Fleet monitoring ──────────────────────────────────────────────────────────
# List all projects managed by this otherness installation.
# Used by /otherness.status for cross-project health view, and by
# scripts/test.sh to pick a reference project for integration checks.
# The first non-otherness project in the list becomes the reference project.
monitor:
  projects: []
  #   - owner/your-project-name    # add your managed projects here
  stale_hours: 24    # alert if _state branch older than this many hours
  idle_hours: 4      # alert if no heartbeat within this many hours

# ── Scheduled execution ───────────────────────────────────────────────────────
# Enables the loop to run automatically via GitHub Actions without human action.
# When configured: .github/workflows/otherness-scheduled.yml triggers on the cron
# schedule below, installs otherness, and runs /otherness.run automatically.
#
# Auth — choose one option:
#
#   Option A: GitHub App (M3, recommended — see docs/design/27-security-model.md §M3)
#     More secure: per-repo scoped, non-exportable, auto-rotates hourly.
#     Setup steps:
#       1. Create a GitHub App at https://github.com/settings/apps/new
#          - Permissions: Repository → Contents (write), Pull requests (write), Issues (write)
#          - Do NOT grant workflow permission (stays within M4 security model)
#       2. Install the App on this repo
#       3. Add two repository secrets (Settings → Secrets and variables → Actions):
#          APP_ID          — the App's numeric ID (shown on the App settings page)
#          APP_PRIVATE_KEY — the App's private key (generated on the App settings page)
#     The workflow auto-detects APP_ID and switches to App token mode.
#
#   Option B: Personal Access Token / PAT (legacy — simpler but less secure)
#     GH_TOKEN — a PAT with repo+workflow scopes (pnz1990 org, all repos)
#     This is the default if APP_ID is not configured.
#
# See onboarding-new-project.md §GitHub App setup for step-by-step instructions.
#
# Other settings:
#   1. The workflow file is created by /otherness.setup automatically.
#   2. Adjust cron to your preferred cadence.
#
# See docs/design/19-scheduled-execution.md for the full design.
#
# schedule:
#   cron: "0 */6 * * *"     # every 6 hours (default). Use https://crontab.guru to customize.
#   model: ""               # LLM model to use. Defaults to the model in your opencode config.
#   api_key_secret: "ANTHROPIC_API_KEY"   # GitHub Actions secret name for your LLM API key
#   vibe_vision_step: true  # Step A: autonomous vision scan before each run. Default: true.
#                           # Promotes shipped Future→Present, flags stale Present items,
#                           # infers Future items from TODO/FIXME in code.
#                           # Set false to disable (e.g. projects with human-only vision).

# ── Simulation calibration ────────────────────────────────────────────────────
# Controls how often SM §4e re-calibrates simulation parameters against real batch
# history. Managed projects inherit otherness fleet defaults on startup and
# re-calibrate against local metrics once ≥5 batches are available.
# See docs/design/23-simulation-as-anchor.md for the full design.
#
# simulation:
#   calibration_cycles: 5   # re-calibrate every N SM cycles (default: 5)

# ── Continuous code hygiene ────────────────────────────────────────────────────
# SM §4h runs a hygiene scan every N batches to detect dead code, stale docs,
# orphaned TODOs, and stale Future items. Opens chore issues for cleanup.
# See docs/design/29-continuous-code-hygiene.md
#
# hygiene:
#   enabled: true            # default: true
#   max_issues_per_scan: 3   # cap new issues per scan run (prevents queue flooding)
#   cycle_interval: 3        # run every N SM cycles

# ── Anchor framework ──────────────────────────────────────────────────────────
# An anchor is a CI workflow that runs on a schedule and posts a machine-readable
# quality score to a GitHub issue. otherness SM §4g-anchor reads the score to
# detect feature→anchor coverage gaps and opens anchor-growth issues.
#
# Configure this when your project has an automated quality signal (e.g. a PDCA
# workflow, an E2E suite, or any CI job that produces a score).
#
# See docs/design/24-project-anchor-framework.md for the full design.
anchor:
  workflow: ""                                         # workflow filename (e.g. "pdca.yml", "e2e.yml")
  score_pattern: "PASS=([0-9]+) FAIL=([0-9]+)"        # regex to extract pass/fail from issue comment
  coverage_target: 80                                  # minimum % of features with anchor coverage
  stagnation_sessions: 3                               # sessions without anchor growth before COORD prioritizes it
  # upstream_version_file: go.mod                       # file to grep for upstream version (e.g. go.mod)
  # upstream_version_pattern: "github.com/awslabs/kro"  # pattern to find in the file (e.g. kro dependency line)
  # journeys_dir: "test/e2e/journeys"                   # path to journey files; used by SM §4g-anchor-parity
